<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ImSheeponator 🐑 v1.2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/meyda@5.6.0/dist/web/meyda.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sky-top: #4facfe;
            --sky-bottom: #00f2fe;
            --grass: #76b852;
            --sheep-white: #ffffff;
            --text-color: #555;
        }

        body {
            margin: 0;
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
            color: var(--text-color);
            font-family: 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* use dvh (dynamic viewport height) for mobile browsers */
            min-height: 100dvh; 
            overflow: hidden;
            text-align: center;
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior: none;
        }

        /* --- CLOUDS --- */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            z-index: 0;
            animation: floatCloud 20s infinite linear;
        }
        .cloud::after, .cloud::before {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        .c1 { width: 120px; height: 50px; top: 10%; left: -150px; animation-duration: 25s; }
        .c1::after { width: 60px; height: 60px; top: -30px; left: 20px; }
        .c1::before { width: 50px; height: 50px; top: -20px; left: 60px; }

        .c2 { width: 100px; height: 40px; top: 20%; left: -150px; animation-duration: 18s; animation-delay: 5s; }
        .c2::after { width: 50px; height: 50px; top: -25px; left: 15px; }

        @keyframes floatCloud {
            from { left: -150px; }
            to { left: 110%; }
        }

        /* --- HILLS --- */
        .hills {
            position: absolute;
            bottom: -50px;
            width: 100%;
            height: 150px; /* Smaller hills for mobile */
            background: var(--grass);
            border-radius: 100% 100% 0 0;
            z-index: 1;
        }

        /* --- MAIN CARD --- */
        .farm-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 20px; /* Reduced padding for mobile */
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 400px;
            width: 85%; /* Fits nicely on phone screens */
            border: 6px solid #fff;
            margin-bottom: 20px; /* Space from bottom */
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #444;
            font-size: 1.8rem; /* Responsive font size */
            margin: 0;
            text-shadow: 2px 2px 0px #eee;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* --- MIC BUTTON --- */
        .mic-container {
            position: relative;
            margin: 15px auto;
            width: 120px; /* Slightly smaller for mobile */
            height: 120px;
        }

        #mic-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--sheep-white);
            border: none;
            cursor: pointer;
            font-size: 3.5rem;
            box-shadow: 0 8px 0 #ddd, 0 15px 20px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            /* Mobile touch fix: removes 300ms delay */
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
        }

        #mic-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #ccc, 0 5px 10px rgba(0,0,0,0.1);
        }

        #mic-btn.recording {
            animation: bounce 0.6s infinite alternate;
            background: #fff0f0;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* --- RESULTS --- */
        #result-card {
            margin-top: 20px;
            padding: 15px;
            background: #e0f7fa;
            border-radius: 20px;
            display: none;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-display {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: var(--sky-top);
            display: block;
            line-height: 1;
        }

        .verdict-display {
            font-weight: 700;
            font-size: 1.1rem;
            color: #555;
            margin-top: 5px;
            display: block;
        }

        /* --- BACK LINK (Notch Safe) --- */
        .back-link {
            position: absolute;
            top: max(20px, env(safe-area-inset-top)); /* iPhone Notch Safety */
            left: 20px;
            text-decoration: none;
            background: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: bold;
            color: var(--text-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
            font-family: 'Nunito', sans-serif;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <a href="../index.html" class="back-link">🏡 Back</a>

    <div class="farm-wrapper">
        <h1>The ImSheeponator</h1>
        <p class="subtitle" id="status-text">Loading the model...</p>

        <div class="mic-container">
            <button id="mic-btn">🎙️</button>
        </div>

        <div id="result-card">
            <span class="score-display" id="score">0%</span>
            <span class="verdict-display" id="verdict">?</span>
        </div>
    </div>

    <div class="hills"></div>

    <script>
        const MODEL_URL = './model/model.json';
        const RECORD_TIME_MS = 2000;

        let model;
        let audioContext;
        let isRecording = false;
        
        const statusText = document.getElementById('status-text');
        const micBtn = document.getElementById('mic-btn');
        const resultCard = document.getElementById('result-card');
        const scoreEl = document.getElementById('score');
        const verdictEl = document.getElementById('verdict');

        // 1. Load Model
        async function loadModel() {
            try {
                model = await tf.loadLayersModel(MODEL_URL);
                statusText.innerText = "Tap mic & say BAAA!";
                console.log("Model ready!");
            } catch (error) {
                console.error(error);
                statusText.innerText = "⚠️ Model Error (Check Console)";
                statusText.style.color = "red";
            }
        }
        loadModel();

        // 2. Button Logic
        micBtn.addEventListener('click', async () => {
            if (!model || isRecording) return;

            // iOS requires AudioContext to be created on user gesture (click)
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            isRecording = true;
            micBtn.classList.add('recording');
            resultCard.style.display = 'none';
            statusText.innerText = "Listening...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioContext.createMediaStreamSource(stream);

                const meyda = Meyda.createMeydaAnalyzer({
                    "audioContext": audioContext,
                    "source": source,
                    "bufferSize": 512,
                    "featureExtractors": ["mfcc"],
                    "numberOfMFCCCoefficients": 40,
                    "windowingFunction": "hamming",
                    "callback": (features) => {}
                });
                meyda.start();

                let mfccData = [];
                const timer = setInterval(() => {
                    const f = meyda.get('mfcc');
                    if(f) mfccData.push(f);
                }, 50);

                setTimeout(() => {
                    clearInterval(timer);
                    meyda.stop();
                    // Don't close audioContext on mobile, just stop tracks
                    stream.getTracks().forEach(t => t.stop()); 
                    
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    statusText.innerText = "Thinking...";
                    
                    analyze(mfccData);
                }, RECORD_TIME_MS);

            } catch (err) {
                console.error(err);
                statusText.innerText = "Microphone blocked :(";
                isRecording = false;
                micBtn.classList.remove('recording');
            }
        });

        async function analyze(mfccHistory) {
            if (mfccHistory.length === 0) {
                statusText.innerText = "No sound heard?";
                return;
            }

            let avg = new Array(40).fill(0);
            for (let i = 0; i < mfccHistory.length; i++) {
                for (let j = 0; j < 40; j++) avg[j] += mfccHistory[i][j];
            }
            for (let j = 0; j < 40; j++) avg[j] /= mfccHistory.length;

            const tensor = tf.tensor2d([avg], [1, 40]);
            const prediction = model.predict(tensor);
            const score = (await prediction.data())[0];
            
            showResult(score);
            tensor.dispose();
            prediction.dispose();
        }

        function showResult(score) {
            const pct = (score * 100).toFixed(0);
            scoreEl.innerText = `${pct}%`;
            
            if (score > 0.8) {
                verdictEl.innerText = "BAAAAAAAAAAAAAAAA! 🐑";
                resultCard.style.background = "#d4edda"; 
                scoreEl.style.color = "#155724";
            } else if (score > 0.5) {
                verdictEl.innerText = "Not bad...";
                resultCard.style.background = "#fff3cd"; 
                scoreEl.style.color = "#856404";
            } else {
                verdictEl.innerText = "Imposter";
                resultCard.style.background = "#f8d7da"; 
                scoreEl.style.color = "#721c24";
            }

            resultCard.style.display = 'block';
            statusText.innerText = "Tap to try again!";
        }
    </script>
</body>
</html>
