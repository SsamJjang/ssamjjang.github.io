<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Fortune Cookie</title>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --text-color: #333333;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            /* Improves tap response on mobile */
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            font-weight: bold;
            font-size: clamp(1.5rem, 5vw, 2.5rem); /* Scales with screen size */
            margin-bottom: 5vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* Game Container */
        .game-area {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Cookie Image */
        #cookie-img {
            width: 90%; /* Responsive width */
            max-width: 800px; 
            height: auto;
            cursor: pointer;
            z-index: 2;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
            transition: transform 0.1s ease-out;
        }

        #cookie-img:active {
            transform: scale(0.98);
        }

        /* The Hammer Image */
        #hammer-img {
            position: absolute;
            top: 0%;
            right: 0%;
            width: 50%; /* Relative to container */
            height: auto;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transform-origin: bottom right;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }

        /* Animations */
        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        .hammer-swing {
            animation: swing 0.2s ease-in-out;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes swing {
            0% { opacity: 1; transform: rotate(30deg) translate(0, 0); }
            50% { transform: rotate(-60deg) translate(-20%, 20%); }
            100% { opacity: 0; transform: rotate(30deg) translate(0, 0); }
        }

        /* The Fortune Message */
        #fortune-display {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; /* Fits mobile screens */
            max-width: 400px;
            text-align: center;
            padding: 40px 20px;
            background: #ffffff;
            border: 2px solid #000;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            z-index: 10;
            animation: fadeUp 0.5s ease-out;
            box-sizing: border-box;
        }

        .fortune-text {
            font-size: clamp(1rem, 4vw, 1.3rem);
            line-height: 1.5;
            margin-bottom: 20px;
            color: #000;
            font-weight: bold;
        }

        .timer-msg {
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

    </style>
</head>

        // --- Elements ---
        const cookieImg = document.getElementById('cookie-img');

        const fortuneDisplay = document.getElementById('fortune-display');
        const fortuneMsg = document.getElementById('fortune-msg');
        const statusText = document.getElementById('status-text');

        // --- Initialization ---
        window.addEventListener('load', checkCooldown);

        function checkCooldown() {
            const lastPlay = localStorage.getItem('fortune_last_play');
            
            if (lastPlay) {
                const timePassed = Date.now() - parseInt(lastPlay);
                const cooldownMs = COOLDOWN_HOURS * 60 * 60 * 1000;

                if (timePassed < cooldownMs) {
                    lockGame(cooldownMs - timePassed);
                    return;
                }
            }
            
            // Ready to play
            cookieImg.addEventListener('click', hitCookie);
        }

        function lockGame(msRemaining) {
            isCracked = true;
            cookieImg.src = "assets/cookie/10.png";
            cookieImg.style.opacity = '0.5';
            cookieImg.style.cursor = 'default';
            cookieImg.removeEventListener('click', hitCookie);
            
            const hours = Math.ceil(msRemaining / (1000 * 60 * 60));
            statusText.innerText = `Available in ${hours}h`;
        }

        // --- Game Logic ---
        function hitCookie(e) {
            if (isCracked) return;

            // 1. Calculate Damage
            const damage = Math.floor(Math.random() * (MAX_DMG - MIN_DMG + 1)) + MIN_DMG;
            currentHp -= damage;

            // 2. Visuals: Hammer
            playHammerAnimation();

            // 3. Update Image
            let imgIndex = Math.floor((100 - currentHp) / 10) + 1;
            
            if (imgIndex < 1) imgIndex = 1;
            if (imgIndex > 10) imgIndex = 10;
            
            cookieImg.src = `assets/cookie/${imgIndex}.png`;

            // 4. Check Win Condition
            if (currentHp <= 0) {
                crackCookie();
            } else {
                cookieImg.classList.remove('shake');
                void cookieImg.offsetWidth; 
                cookieImg.classList.add('shake');
            }
        }

        function playHammerAnimation() {
            hammerImg.style.opacity = '1';
            hammerImg.classList.remove('hammer-swing');
            void hammerImg.offsetWidth;
            hammerImg.classList.add('hammer-swing');
            
            setTimeout(() => {
                hammerImg.style.opacity = '0';
            }, 200);
        }

        function crackCookie() {
            isCracked = true;
            cookieImg.src = "assets/cookie/10.png";
            
            const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
            
            statusText.innerText = "Opened";
            
            fortuneMsg.innerText = randomFortune;
            fortuneDisplay.style.display = 'block';

            localStorage.setItem('fortune_last_play', Date.now().toString());
            
            cookieImg.removeEventListener('click', hitCookie);
            cookieImg.style.cursor = 'default';
        }
